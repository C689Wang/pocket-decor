[package]
name = "pocket_decor_bevy"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.15.0"
bevy_simple_text_input = "0.10"
bevy_obj = "0.15"
bevy_mod_picking = "0.20"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
